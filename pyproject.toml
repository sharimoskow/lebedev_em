[build-system]
requires = ["setuptools >= 68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lebedev_em"
version = "0.1.0"
description = "Lebedev staggered-grid FD scheme for 3D EM logging in anisotropic media (DDH03)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shari Moskow" }]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ipython",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
